name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dryRun:
        description: validate via guest test and package only; uncheck to publish after approval
        type: boolean
        required: true
        default: true

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: 1.95.0
  # The crate's rust-version.
  RUST_MSRV: '1.89'

jobs:
  check:
    name: Check / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
        working-directory: aci-edge-sandbox
    env:
      # Stage no bundle for --all-features builds: scripts/test-agent-bundling.ps1 checks staging.
      ACI_EDGE_SANDBOXES_AGENT_BUNDLE: skip
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: |
          rustup toolchain install $env:RUST_TOOLCHAIN --profile minimal --component clippy,rustfmt
          rustup toolchain install $env:RUST_MSRV --profile minimal
      - run: cargo +$env:RUST_TOOLCHAIN fmt --all -- --check
      - run: cargo +$env:RUST_TOOLCHAIN clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo +$env:RUST_TOOLCHAIN test --locked --workspace --all-features
      - run: cargo +$env:RUST_TOOLCHAIN doc --locked --workspace --no-deps --all-features
      - run: cargo +$env:RUST_MSRV check --locked --workspace --all-targets --all-features
      - name: Check agent bundle staging
        working-directory: .
        env:
          ACI_EDGE_SANDBOXES_AGENT_BUNDLE: ''
        run: ./scripts/test-agent-bundling.ps1 -Toolchain $env:RUST_TOOLCHAIN -WorkDir $env:RUNNER_TEMP/agent-bundling

  bundle-pre-packaging-validation:
    name: Bundle pre-packaging validation
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/edge-functional.yml

  package:
    name: Package for crates.io
    needs: bundle-pre-packaging-validation
    # Pull requests skip bundle validation; main pushes and manual runs must pass it before packaging.
    if: ${{ !cancelled() && (needs.bundle-pre-packaging-validation.result == 'success' || (github.event_name == 'pull_request' && needs.bundle-pre-packaging-validation.result == 'skipped')) }}
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install $env:RUST_TOOLCHAIN --profile minimal
      # One joint dry run for crates.io; it uploads nothing.
      - run: ./scripts/release/Invoke-CratePackage.ps1 -OutDir $env:RUNNER_TEMP/crates -Toolchain $env:RUST_TOOLCHAIN
      # A consumer of the archives outside the repository, with no bundle variable: its build
      # downloads and verifies the bundle that agent-bundle.json pins.
      - name: Check an SDK-like consumer of the archives
        run: ./scripts/release/Test-CrateConsumer.ps1 -ArchiveDir $env:RUNNER_TEMP/crates -WorkDir $env:RUNNER_TEMP/consumer -Toolchain $env:RUST_TOOLCHAIN
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crates
          path: ${{ runner.temp }}/crates

  publish:
    name: Publish to crates.io
    needs: [check, bundle-pre-packaging-validation, package]
    if: github.event_name == 'workflow_dispatch' && !inputs.dryRun
    runs-on: windows-latest
    environment: crates-io
    timeout-minutes: 120
    concurrency:
      group: crates-io-publish
      cancel-in-progress: false
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Download the reviewed crate artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: crates
          path: ${{ runner.temp }}/approved-crates
      - name: Install Rust
        run: |
          rustup toolchain install $env:RUST_TOOLCHAIN --profile minimal
          if ($LASTEXITCODE -ne 0) { throw "rustup failed with exit $LASTEXITCODE" }
      - name: Publish the approved crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          Set-StrictMode -Version Latest
          if ([string]::IsNullOrWhiteSpace($env:CARGO_REGISTRY_TOKEN)) {
            throw 'Configure CARGO_REGISTRY_TOKEN in the crates-io environment before publishing.'
          }
          $approvalDir = Join-Path $env:RUNNER_TEMP 'approved-crates'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          & .\scripts\release\Invoke-CratePublish.ps1 `
            -ApprovedManifest (Join-Path $approvalDir 'release-manifest.json') `
            -ApprovedSha256Sums (Join-Path $approvalDir 'SHA256SUMS') `
            -ExpectedCommit $env:GITHUB_SHA `
            -Toolchain $env:RUST_TOOLCHAIN `
            -Repository $env:GITHUB_WORKSPACE `
            -WorkDir (Join-Path $env:RUNNER_TEMP "crate-publish-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT")
