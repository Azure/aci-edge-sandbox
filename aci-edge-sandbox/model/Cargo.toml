[package]
name = "aci_edge_sandboxes_model"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Serializable data model of the edge sandbox lifecycle"
license = "MIT"
repository = "https://github.com/Azure/aci-edge-sandbox"
publish = false

[dependencies]
getrandom = "0.4"
humantime = "2.4"
# `Cidr` and `Hypervisor` come from NVX, without its host side.
nvx = { version = "0.1.0-alpha.7", default-features = false, features = ["serde"] }
serde = { version = "1.0.200", features = ["derive"] }
serde_json = "1.0.120"
thiserror = "2"

[lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "warn"
